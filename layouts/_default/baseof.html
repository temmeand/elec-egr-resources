<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default site.Title }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ "/" | relURL }}">EE<span>&middot;</span>Resources</a>
      <nav aria-label="Main navigation">
        <a href="{{ "resources/ee2301/" | relURL }}">Resources</a>
        <a href="https://github.com/temmeand/elec-egr-resources">Source</a>
      </nav>
    </header>
    {{ block "main" . }}{{ end }}
    <footer class="site-footer">
      <div class="footer-copy">
        <span>Electrical Engineering Resources</span>
        <span>Source: AGPL-3.0 &middot; Rendered resource list: CC BY-NC-SA 4.0</span>
        <span class="attribution"><code>Assisted-by: LLM GitHub Copilot GPT-6 Luna</code></span>
      </div>
      <a class="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" aria-label="Creative Commons Attribution-NonCommercial-ShareAlike 4.0">
        <img src="{{ "cc.svg" | relURL }}" alt="CC">
        <img src="{{ "by.svg" | relURL }}" alt="BY">
        <img src="{{ "nc.svg" | relURL }}" alt="NC">
        <img src="{{ "sa.svg" | relURL }}" alt="SA">
      </a>
    </footer>
  </body>
</html>
